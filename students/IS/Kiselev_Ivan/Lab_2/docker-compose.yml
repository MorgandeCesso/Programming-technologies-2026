services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lostfound
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lostfound"]
      interval: 2s
      timeout: 3s
      retries: 20
